[package]
name = "recharged"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rc_core.workspace = true
rc_track.workspace = true
rc_vehicle.workspace = true
rc_input.workspace = true
rc_weather.workspace = true
rc_race.workspace = true
rc_ai.workspace = true
rc_items.workspace = true
rc_camera.workspace = true
rc_render.workspace = true
rc_vfx.workspace = true
rc_audio.workspace = true
rc_game.workspace = true
rc_ui.workspace = true
bevy.workspace = true
bevy_rapier3d.workspace = true
bevy-react.workspace = true

[features]
# Faster incremental dev builds + asset hot reload: `cargo run -p recharged --features dev`.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]
# Rapier collider wireframes (gizmos).
debug-physics = ["bevy_rapier3d/debug-render-3d"]
