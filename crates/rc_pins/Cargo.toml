[package]
name = "rc_pins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Build hygiene only: pins third-party features to what the full game resolves."

# Why: Cargo resolves features per build invocation, so `cargo test -p rc_core` and
# `cargo build -p recharged` used to resolve e.g. `glam`/`uuid` with different features and each
# compiled its own copy of Bevy (+2.5 min, +1.4 GB per distinct set). rc_core depends on this crate,
# so every member resolves the same features as the full workspace and reuses one shared build.
# GENERATED by `python3 crates/rc_pins/update.py` (run it after dependency changes).
# No code may use these crates through this package.

[lints]
workspace = true

[dependencies]
downcast_rs_2 = { package = "downcast-rs", version = "2.0.2", default-features = false, features = ["std", "sync"] }
erased_serde_0_4 = { package = "erased-serde", version = "0.4.10", features = ["alloc", "std"] }
futures_channel_0_3 = { package = "futures-channel", version = "0.3.34", default-features = false, features = ["alloc", "futures-sink", "sink", "std"] }
futures_sink_0_3 = { package = "futures-sink", version = "0.3.34", default-features = false, features = ["alloc", "std"] }
futures_task_0_3 = { package = "futures-task", version = "0.3.34", default-features = false, features = ["alloc", "std"] }
futures_util_0_3 = { package = "futures-util", version = "0.3.34", default-features = false, features = ["alloc", "async-await", "async-await-macro", "channel", "futures-channel", "futures-io", "futures-macro", "futures-sink", "io", "memchr", "sink", "slab", "std"] }
getrandom_0_4 = { package = "getrandom", version = "0.4.3", default-features = false, features = ["std", "sys_rng"] }
glam_0_33 = { package = "glam", version = "0.33.12", features = ["all-types", "approx", "approx-05", "bytemuck", "encase", "encase-012", "f64", "float-types", "i16", "i32", "i64", "i8", "integer-types", "isize", "mint", "mint-05", "nostd-libm", "rand", "rand-010", "serde", "size-types", "std", "u16", "u32", "u64", "u8", "usize"] }
num_complex_0_4 = { package = "num-complex", version = "0.4.6", features = ["std"] }
num_traits_0_2 = { package = "num-traits", version = "0.2.19", features = ["i128", "libm", "std"] }
profiling_1 = { package = "profiling", version = "1.0.18", features = ["procmacros", "profiling-procmacros"] }
rand_0_10 = { package = "rand", version = "0.10.3", features = ["alloc", "std", "std_rng", "sys_rng", "thread_rng"] }
serde_json_1 = { package = "serde_json", version = "1.0.154", features = ["alloc", "float_roundtrip", "indexmap", "preserve_order", "raw_value", "std"] }
strict_num_0_1 = { package = "strict-num", version = "0.1.1", features = ["approx-eq", "float-cmp"] }
tinystr_0_8 = { package = "tinystr", version = "0.8.4", features = ["alloc", "zerovec"] }
uuid_1 = { package = "uuid", version = "1.28.0", features = ["fast-rng", "rng", "serde", "std", "v4"] }
writeable_0_6 = { package = "writeable", version = "0.6.4", features = ["alloc"] }
zerotrie_0_2 = { package = "zerotrie", version = "0.2.5", features = ["alloc", "yoke", "zerofrom"] }

[build-dependencies]
either_1 = { package = "either", version = "1.19.0", features = ["std", "use_std"] }
indexmap_2 = { package = "indexmap", version = "2.14.2", features = ["serde", "std"] }
serde_core_1 = { package = "serde_core", version = "1.0.229", default-features = false, features = ["alloc", "result", "std"] }
